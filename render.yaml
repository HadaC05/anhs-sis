services:
  - type: web
    name: anhs-sis
    runtime: docker
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # config/database.php reads DB_URL (not DATABASE_URL).
      - key: DB_URL
        fromDatabase:
          name: anhs-sis-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: APP_KEY
        generateValue: true
      # Keep disabled in production. Temporarily set to true only when you
      # deliberately want to create the application's demo users and data.
      - key: RUN_DATABASE_SEEDER
        value: "false"
      # Set this to the public Render URL after the first deployment.
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      # Optional: attach a paid persistent disk at /var/data and then enable these.
      # - key: PUBLIC_DISK_ROOT
      #   value: /var/data
      # - key: FILESYSTEM_DISK
      #   value: public

  - type: worker
    name: anhs-sis-worker
    runtime: docker
    dockerCommand: php artisan queue:work database --tries=1 --timeout=1200 --sleep=2
    maxShutdownDelaySeconds: 300
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: anhs-sis-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: APP_KEY
        fromService:
          name: anhs-sis
          type: web
          envVarKey: APP_KEY

databases:
  - name: anhs-sis-db
    databaseName: anhs_sis
    user: anhs_sis
